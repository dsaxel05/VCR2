name: Engine tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: index.html is a fresh build of src/
        run: |
          python build.py
          git diff --exit-code -- index.html || { echo "::error::index.html is out of date: run python build.py and commit it"; exit 1; }
      - name: Engine, archetype, property and configuration tests
        run: |
          for f in tests/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: Build step keeps code intact (comments and indentation only)
        run: python tests/jsstrip_test.py
      - name: Page size budget
        run: python tools/size_check.py
