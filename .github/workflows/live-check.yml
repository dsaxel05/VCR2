name: Live site check

# Every six hours: https://vcr2.app/ must serve exactly the files in this repository (tools/live_check.py).
# A failure means the domain, the DNS or the hosting serves something else: GitHub emails the owner.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: The live site serves exactly this repository
        run: python tools/live_check.py
