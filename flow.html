.fl-notes li{padding:6px 0;border-bottom:1px solid var(--line-1,var(--line-2))}
.fl-danger{color:var(--risk-text,var(--red))}
.fl-settabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}
.fl-settab{background:none;border:1px solid var(--line-2);border-radius:var(--radius-pill);padding:5px 12px;font:inherit;font-size:.88rem;color:var(--text);cursor:pointer}
.fl-settab.active{background:var(--brand);color:var(--brand-ink,#fff);border-color:var(--brand)}
.fl-setbody{padding:18px 22px}
.fl-setbody h2{font-family:var(--font-display);font-weight:400;margin-top:0}
.fl-setbody h3{margin:18px 0 6px;font-size:1rem}
.fl-savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 14px;margin-top:12px;background:var(--bg);border-top:1px solid var(--line-2)}
.fl-savebar.dirty{border-top:2px solid var(--gold,#b8954a)}
.fl-code{white-space:pre-wrap;word-break:break-all;font-size:.8rem;padding:10px;border:1px solid var(--line-2);border-radius:8px;max-width:100%}
.fl-big-code{font-size:1.05rem}
.fl-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
.fl-bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding:6px 0 22px}
.fl-bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.fl-bar-fill{display:block;background:linear-gradient(180deg,var(--gold,#b8954a),var(--brand));border-radius:4px 4px 0 0;min-height:2px}
.fl-bar-n{position:absolute;top:-2px;left:0;right:0;text-align:center;font-size:.75rem}
.fl-bar-l{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:.72rem;opacity:.75}
.fl-help h2{font-family:var(--font-display);font-weight:400;font-size:1.3rem;margin:18px 0 4px}
.fl-help p{max-width:80ch}
.fl-foot{padding:16px 20px;font-size:.8rem;opacity:.75;text-align:center;border-top:1px solid var(--line-1,var(--line-2))}
.fl-drop{padding:16px 20px}
.skip-link{position:absolute;left:-9999px}
.skip-link:focus{left:10px;top:10px;z-index:100;background:var(--bg);padding:6px 10px}
@media (max-width:760px){.fl-top{padding:8px 12px;position:static}
.fl-tabs{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap}
.fl-tab{flex:none}
.fl-main{padding:14px 16px 50px}
.fl-head h1{font-size:1.5rem}
.fl-tiles{grid-template-columns:repeat(2,1fr)}
.fl-filters .form-inp,.fl-filters input[type=search]{min-width:0;flex:1 1 45%}
.fl-tbl thead{display:none}
.fl-tbl tr{display:block;padding:8px 0;border-bottom:1px solid var(--line-2)}
.fl-tbl th,.fl-tbl td{display:block;border:0;padding:2px 4px}
.fl-d-b,.fl-d-h{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){.fl-bar-fill{transition:none}
}

-only contracts make NRR look better than the real commitment level.'},{g:'Collections',id:'deferred_revenue',lbl:'Deferred revenue balance',t:'num',unit:'$',hint:'Cash collected for services not yet delivered.'},{g:'Collections',id:'ar_over_90',lbl:'Receivables over 90 days',t:'num',unit:'$',hint:'Booked revenue that has not been collected. A quiet churn indicator.'},]},{id:'capital',label:'Capital & burn',em:'🔥',ibg:'#1e1308',desc:'Runway, burn efficiency and dilution overhang are all derived from these. Do not enter a runway figure.',fields:[{g:'Position',id:'cash_on_hand',lbl:'Cash and equivalents',t:'num',unit:'$',req:true,hint:'Bank balance today, excluding undrawn debt facilities.'},{g:'Position',id:'net_burn',lbl:'Net monthly burn',t:'num',unit:'$',req:true,hint:'Average over the last three months. Net of revenue collected, not gross spend.'},{g:'Position',id:'gross_burn',lbl:'Gross monthly burn (all cash expenses)',t:'num',unit:'$',hint:'Everything that leaves the bank in a month, before revenue. Gives the runway if revenue stopped, and cross-checks the net burn.'},{g:'Position',id:'total_raised',lbl:'Total equity raised',t:'num',unit:'$',req:true,hint:'Cumulative primary equity in. Excludes debt and unconverted SAFEs.'},{g:'Structure',id:'pre_money',lbl:'Pre-money at last round',t:'num',unit:'$',hint:'Used to size the SAFE overhang and preference stack.'},{g:'Structure',id:'safes_outstanding',lbl:'SAFEs not yet converted',t:'num',unit:'$',hint:'Face value outstanding. This dilutes the next round, not the last one. Enter convertible notes separately below.'},{g:'Structure',id:'notes_principal',lbl:'Convertible notes outstanding (principal)',t:'num',unit:'$',hint:'Unlike SAFEs, notes accrue interest and convert on the pre-money. Terms go in Round & returns.'},{g:'Structure',id:'debt_outstanding',lbl:'Venture debt outstanding',t:'num',unit:'$',hint:'Principal outstanding. Sits ahead of equity in a liquidation.'},{g:'Structure',id:'months_since_round',lbl:'Months since last round closed',t:'num',unit:'months'},]},{id:'gtm',label:'Customers & go-to-market',em:'🎯',ibg:'#0a1e13',desc:'CAC, payback, LTV:CAC, ACV and magic number are all computed from the spend and count figures here.',fields:[{g:'Base',id:'customers_now',lbl:'Paying customers today',t:'num',unit:'',req:true,hint:'Paying logos, not seats or users. Sets whether retention metrics are meaningful.'},{g:'Base',id:'customers_12mo',lbl:'Paying customers 12 months ago',t:'num',unit:''},{g:'Base',id:'logos_lost_l12',lbl:'Logos lost in last 12 months',t:'num',unit:''},{g:'Concentration',id:'top1_pct',lbl:'Largest customer share of ARR',t:'num',unit:'%'},{g:'Concentration',id:'top5_pct',lbl:'Top 5 share of ARR',t:'num',unit:'%'},{g:'Concentration',id:'top10_pct',lbl:'Top 10 share of ARR',t:'num',unit:'%'},{g:'Acquisition spend',id:'sm_spend_l12',lbl:'Sales & marketing spend, last 12 months',t:'num',unit:'$',hint:'Fully loaded: salaries, commission, ad spend, events, tooling.'},{g:'Acquisition spend',id:'new_customers_l12',lbl:'New customers won, last 12 months',t:'num',unit:'',hint:'With S&M spend this gives blended CAC. Do not enter a CAC figure.'},{g:'Acquisition spend',id:'sm_spend_prior_q',lbl:'S&M spend, prior quarter',t:'num',unit:'$'},{g:'Acquisition spend',id:'new_arr_prior_q',lbl:'Net new ARR, most recent quarter',t:'num',unit:'$',hint:'With prior-quarter S&M this gives the magic number.'},{g:'Sales motion',id:'win_rate',lbl:'Win rate on qualified opportunities',t:'num',unit:'%',chips:[10,20,30,45]},{g:'Sales motion',id:'sales_cycle',lbl:'Median sales cycle',t:'num',unit:'days'},{g:'Sales motion',id:'pipeline_coverage',lbl:'Pipeline coverage against next-quarter target',t:'num',unit:'x'},{g:'Sales motion',id:'quota_attainment',lbl:'Reps at or above quota',t:'num',unit:'%',chips:[30,50,70,90],hint:'Leave blank if there are fewer than three quota-carrying reps.'},{g:'Sales motion',id:'pct_paid',lbl:'New ARR from paid acquisition',t:'num',unit:'%'},]},{id:'team',label:'Team',em:'🧑‍🚀',ibg:'#1a1108',desc:'Verifiable facts only. This build removes the behavioural and linguistic signals from v2. They had no validated predictive power.',fields:[{g:'Size',id:'headcount_now',lbl:'Headcount today',t:'num',unit:'',req:true},{g:'Size',id:'headcount_12mo',lbl:'Headcount 12 months ago',t:'num',unit:''},{g:'Size',id:'headcount_eng',lbl:'Engineering headcount',t:'num',unit:''},{g:'Size',id:'headcount_sales',lbl:'Sales & marketing headcount',t:'num',unit:''},{g:'Size',id:'avg_loaded_comp',lbl:'Average fully loaded cost per employee',t:'num',unit:'$',hint:'Salary, tax, benefits, equipment. Defaults to $165,000 if blank. Used to sanity-check burn.'},{g:'Founders',id:'founders_count',lbl:'Number of founders',t:'num',unit:''},{g:'Founders',id:'founder_max_equity',lbl:'Largest founder stake',t:'num',unit:'%',hint:'A very lopsided split among active co-founders is a known source of later conflict.'},{g:'Founders',id:'founder_domain_years',lbl:'Years in this domain before founding',t:'num',unit:'years'},{g:'Founders',id:'prior_exit',lbl:'A founder has a prior acquisition or IPO',t:'bool',hint:'Verifiable outcome, not a claim of prior startup experience.'},{g:'Founders',id:'founder_departed',lbl:'A co-founder has left since inception',t:'bool',hint:'If yes, ask how their equity was handled. Unresolved founder equity is a cap table problem.'},{g:'Founders',id:'founders_years_together',lbl:'Years the founders have worked together',t:'num',unit:'years',chips:[0,1,3,5],hint:'Including before this company. A proxy for cohesion: teams that have already worked through hard periods together break up less.'},{g:'Founders',id:'technical_founder',lbl:'A founder can build the core product themselves',t:'bool',hint:'Not “manages the engineers”: writes or designs the core of what is sold.'},{g:'Retention',id:'eng_departures_l12',lbl:'Engineering departures, last 12 months',t:'num',unit:'',hint:'Turnover rate is computed against engineering headcount.'},]},{id:' s who would be “very disappointed” without the product',t:'num',unit:'%',chips:[25,40,50,60],hint:'Sean Ellis test. 40% or more is the usual sign of product-market fit.'},{g:'Product-market fit',id:'pmf_respondents',lbl:'Respondents to that survey',t:'num',unit:'',hint:'Below about 30 answers the percentage is not scored.'},{g:'Product-market fit',id:'nps',lbl:'Net Promoter Score',t:'num',unit:'',chips:[0,20,40,60],hint:'% promoters − % detractors, from −100 to +100.'},{g:'Timing',id:'why_now',lbl:'Why now',t:'txt',hint:'The change (technology, regulation, cost, behaviour) that makes this possible today and was not true five years ago.'},]},{id:'model',label:'Business-model specifics',em:'🧩',ibg:'#0b1b22',desc:'Metrics that only mean something for this business model. The fields shown follow the model chosen at setup, and the ones scored are scored only for that model.',fields:[{g:'Product usage',id:'seat_util',lbl:'Purchased seats or licences actively used',t:'num',unit:'%',models:['saas','ai_app'],chips:[40,60,75,90],hint:'Low utilisation is the leading indicator of contraction at renewal.'},{g:'Product usage',id:'usage_based_pct',lbl:'Revenue billed on usage rather than a fixed fee',t:'num',unit:'%',models:['saas','ai_app'],hint:'Usage revenue is real but volatile; it moves NRR in both directions.'},{g:'Model economics',id:'inference_pct',lbl:'Inference and model API cost as a share of revenue',t:'num',unit:'%',models:['ai_app'],chips:[10,20,35,50],hint:'Past a third of revenue, gross margin is mostly set by a supplier’s price list.'},{g:'Model economics',id:'gm_12mo',lbl:'Gross margin 12 months ago',t:'num',unit:'%',models:['ai_app','saas'],hint:'With today’s margin this gives the margin trend. AI applications often start low and must show the path up.'},{g:'Model economics',id:'top_model_share',lbl:'Inference spend with a single model provider',t:'num',unit:'%',models:['ai_app']},{g:'Model economics',id:'proprietary_data',lbl:'The product depends on proprietary function flSheetRows(rows){const head=(rows[0]||[]).map(h=>wsNorm(h).trim()),col=(...names)=>head.findIndex(h=>names.some(n=>h===n||h.startsWith(n+' ')));const c={company:col('company','company name','startup','name'),website:col('website','url','site','domain'),founder:col('founder','founders','ceo'),email:col('email','e-mail','contact email'),deck:col('deck','deck link','pitch deck','file','deck file'),stage:col('stage','round'),sector:col('sector','industry','vertical'),status:col('status'),received:col('date received','date','received','date added'),source:col('source','channel'),referral:col('referral','referral source','intro by'),lead:col('lead partner','partner'),next:col('next action','next step'),owner:col('follow-up owner','owner')};return rows.slice(1).filter(r=>r.some(x=>String(x||'').trim())).map(r=>{const g=k=>c[k]>=0?String(r[c[k]]||'').trim():'';return{company:g('company'),website:g('website'),founder:g('founder'),email:g('email'),deck:g('deck'),stage:g('stage'),sector:g('sector'),status:g('status'),received:g('received'),source:g('source'),referral:g('referral'),lead:g('lead'),next:g('next'),owner:g('owner')}})}
function flMatchFile(row,files){const base=n=>wsKey(String(n).split('/').pop().replace(/\.[a-z0-9]{2,5}$/i,'').replace(/\b(pitch|deck|investor|presentation|final|v\d+|20\d\d)\b/ig,' '));if(row.deck){const b=base(row.deck);const f=files.find(x=>x.name===row.deck.split('/').pop()||base(x.name)===b);if(f)return f}

const flStageId=v=>{const s=String(v||'').toLowerCase();return /pre/.test(s)?'preseed':/seed/.test(s)?'seed':/\ba\b|series a/.test(s)?'a':/series [b-z]|growth|\bb\b/.test(s)?'b':''};const flSectorId=v=>{const n=wsNorm(v).trim();if(!n)return '';const s=WS_SECTORS.find(x=>wsNorm(x.n).trim()===n||x.id===n||x.kw.includes(n));return s?s.id:''};async function flImport(){const ws=flWs();if(FS.busy)return;const pick=id=>[...(($id(id)||{}).files||[])];const raw=pick('fl-files').concat(pick('fl-folder')),sheetF=pick('fl-sheet')[0],source=($id('fl-src')||{}).value||'import';if(!raw.length&&!sheetF){toast('Choose decks, a folder or a spreadsheet first.','err');return}
const files=[];for(const f of raw.slice(0,400)){if(f.size>25e6){FS.log.push({name:f.name,text:'skipped: larger than 25 MB'});continue}const rel=f.webkitRelativePath||'';files.push({name:f.name,dir:rel.split('/').length>2?rel.split('/').slice(-2,-1)[0]:'',bytes:new Uint8Array(await f.arrayBuffer()),type:f.type})}
const groups=new Map();for(const f of files){const k=f.dir||f.name;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(f)}
let rows=[];if(sheetF){const u8=new Uint8Array(await sheetF.arrayBuffer());try{if(/\.xlsx$/i.test(sheetF.name)){const sh=pickSheet(await readWorkbook(u8.buffer),'library');rows=flSheetRows(sh?sh.rows:[])}else rows=flSheetRows(parseCSV(new TextDecoder().decode(u8)))}catch(e){toast('The spreadsheet could not be read: '+(e.message||e),'err');return}}
const items=[],used=new Set();for(const r of rows){const f=flMatchFile(r,files),g=f?groups.get(f.dir||f.name):null;if(g)used.add(f.dir||f.name);items.push({source:(r.source&&/web|site/i.test(r.source)?'website':r.source&&/linked/i.test(r.source)?'linkedin':r.source&&/mail/i.test(r.source)?'email':source),received:wsTime(r.received)?new Date(wsTime(r.received)).toISOString():new Date().toISOString(),meta:{company:r.company,website:r.website,founder:r.founder,email:r.email,stage:flStageId(r.stage),sector:flSectorId(r.sector),referral:r.referral,deckLink:/^https:\/\//.test(r.deck)?r.deck:'',via:'your spreadsheet'},files:g||[],extra:{status:ws.pipeline.statuses.find(s=>wsNorm(s).trim()===wsNorm(r.status).trim())||'',leadPartner:r.lead,nextAction:r.next,followOwner:r.owner},name:r.company||(f&&f.name)||'row'})}
for(const [k,g] of groups)if(!used.has(k))items.push({source,received:new Date().toISOString(),meta:{},files:g,name:k});await flRunItems(items)}
async function flRunItems(items){const ws=flWs();FS.busy=`Reading ${items.length} compan${items.length===1?'y':'ies'}…`;flRender();let n=0,merged=0;for(const it of items){n++;FS.busy=`${n} of ${items.length}: ${it.name||'company'}`;flRenderBusy();const t0=wsNow();try{const r=await wsProcessItem(flCtx(),it,s=>{FS.busy=`${n} of ${items.length}: ${it.name||'company'}: ${s}`;flRenderBusy()});const d=r.deal;FS.textCache.set(d.id,r.lines||[]);if(it.extra)for(const [k,v] of Object.entries(it.extra))if(v&&!d[k])d[k]=v;const i=FS.deals.findIndex(x=>x.id===d.id);if(i>=0)FS.deals[i]=d;else FS.deals.push(d);if(r.merged)merged++;await flSave(d);if(ws.integrations.webhook)wsWebhook(flCtx(),r.merged?'company.updated':'company.created',d).catch(()=>{});if(ws.storage.memo.auto&&r.score.meets&&wsConnector(ws)&&wsConnector(ws).connected()&&!d.memo){try{await wsMakeMemo(flCtx(),d);await flSave(d)}catch(e){}}

function flPath(obj,path,v){const ks=path.split('.');let o=obj;for(const k of ks.slice(0,-1)){if(o[k]==null||typeof o[k]!=='object')o[k]={};o=o[k]}if(arguments.length>2)o[ks[ks.length-1]]=v;return o[ks[ks.length-1]]}

function flHelp(){return `<div class="fl-head"><h1>How Deal flow works</h1></div><div class="card fl-help">
<h2>Workspaces</h2><p>A workspace is one investor's deal flow: a fund, an angel, a syndicate or an accelerator. Everything is set per workspace: the thesis, the scorecard, the pipeline, the Drive folders, the master sheet and its columns, the memo template and the team. One workspace never sees another's companies: the database refuses it, not just the page.</p>
<h2>What you can drop</h2><p>Pitch decks as PDF, PowerPoint (.pptx) or Word, image-only decks and screenshots (read with OCR, in your browser), e-mails saved as .eml with their attachments, a .zip of decks, and your company spreadsheet (.xlsx or .csv, or a Google Sheet downloaded as .xlsx). Founder e-mails and call transcripts (text, .docx, PDF or pasted) are added to a company from its panel, then it is re-scored. Old formats (.ppt, .doc), password-protected files and links (DocSend, Notion) cannot be read: download or export them first.</p>
<h2>Thesis check</h2><p>Each company is <b>In thesis</b>, <b>Borderline</b> or <b>Out of thesis</b>, with every reason and where it was found (file, page or slide, quote). Information that is missing is never a fail: the company is “Borderline (needs info)” with the questions to ask. Change the thesis in Settings and every company is re-checked.</p>
<h2>Scorecard</h2><p>Your pillars, weights (total 100%), 1 to 5 scale, threshold and tiers. VCR2 scores a pillar itself only from evidence: the “Profitability & Durability” template has its unit-economics pillar scored from gross margin, burn multiple, CAC payback, LTV:CAC, NRR, GRR, Rule of 40 and runway, capped when a consistency check on them fails. A figure read only in the deck is a claim: such a score says “from the deck's claims (unverified)”. Team, market, product and exit moat are scored by a reviewer in one click, with the evidence and the questions next to the buttons; with your own AI key (main page, AI assist) you can ask for a suggestion, which is never applied until a person confirms it. Every score says where it came from.</p>
<h2>Master sheet</h2><p>Pick your Google Sheet, then say for each column whether VCR2 writes it, only reads it, or ignores it. Formula columns are always read only. A cell your team changed is never overwritten: its value comes back into VCR2. Dropdown columns keep your own values. A company already in the sheet gets its row updated, never a second row (matched on name, web domain, founder or deck link).</p>
<h2>Embedding the form</h2><p>Settings, Intake: copy the embed code and paste it into your website (most site builders have an “embed HTML” block). Founders attach their deck and a few details; it arrives in your workspace.</p>
<h2>The forwarding address</h2><p>Settings, Intake shows your workspace's private address. Forward a founder's e-mail with its deck to it, or set an automatic forward in your mailbox. It is read when anyone in your team opens Deal flow (“Check the inbox”), filed in your Drive and logged in your sheet. Nothing is analysed on a server: VCR2 keeps the e-mail at most 14 days, until your browser has read it.</p>
<h2>Deal memos</h2><p>From a company's panel, “Create the deal memo” writes a Google Doc from your template (or VCR2's), filled with the scores and their sources, the metrics, the checks, the risks, the questions and your notes, and puts its link in the master sheet. It can run automatically above your threshold (off by default).</p>
<h2>Due diligence process</h2><p>Your process stages are your pipeline statuses: one list. In Settings, Process stages, give each stage a goal, a checklist, an owner role, a target time and the evidence VCR2 brings to it (metrics, consistency checks, scorecard, ranked questions). The full preset runs Sourcing → Thesis screen → First call → Deep diligence → IC memo → IC vote → Term sheet → Close → Post-investment monitoring. You can also import your own process notes (text, .docx or PDF): VCR2 places headings and bullets onto your stages and recognises committee rules; you confirm before anything changes. In a company's panel, tick the checklist of its stage; the time spent in the stage is measured against its target.</p>
<h2>Investment committee and voting</h2><p>Settings, Investment committee: members and roles, quorum, the voting rule (simple majority, two-thirds supermajority, unanimous, or majority with a managing-partner veto), conflicts (declared and recused, or declared and recorded), ties (declined, chair decides, or vote again) and how a "yes, with conditions" counts. In the company's panel, record each member's vote: VCR2 shows the outcome before you save, stores who voted, how, when and the conditions with the company and its IC memo (the deal memo), moves the status on, and writes the decision and its date to your master sheet.</p>
<h2>LP data room</h2><p>Two LP-facing documents. The <b>due diligence process</b>: a one-page flowchart, each stage, the committee and its rules, and how evidence-first scoring fits in, with no company and no internal note. The <b>anonymized pipeline</b>: one line per company with a code name by sector (your prefixes, e.g. FoW-01), sector and sub-sector, stage, round size and valuation as ranges, region only, a description that does not identify the company, why it fits, its pipeline stage and, if you choose, its tier. Filter by sector, stage, tier or date and untick what to leave out. Before any export, every entry is checked for names, founders, web addresses, e-mails, logos, exact figures, named customers or investors, cities and unusual combinations; each flag comes with a safer wording. Nothing exports until every flag is fixed or accepted by a named reviewer (logged). Exports carry "LP-facing" and their "data as of" date; in Google Drive they are a Doc, a Sheet and a PDF, refreshed in one click with the same links, ready for a data room or DocSend.</p>
<h2>Speed</h2><p>The dashboard shows the median time from receiving a deck to a complete scored row, and the automated part alone (usually seconds).</p>
<h2>Privacy</h2><p>Decks and their text stay in your browser and your Drive. Signed in, VCR2 keeps per company the facts with short quotes (160 characters at most), the scores, statuses and notes, so your team shares them. Not investment advice.</p></div>`}

<select class="form-inp" aria-label="Stage" data-change="flLpFilter" data-a="stage">${opt('','All stages',f.stage||'')}${WS_STAGE_IDS.map(s=>opt(s,WS_STAGE_N[s],f.stage)).join('')}</select>
<select class="form-inp" aria-label="Tier" data-change="flLpFilter" data-a="tier">${opt('','All tiers',f.tier||'')}${ws.scorecard.tiers.map(t=>opt(t.name,t.name,f.tier)).join('')}</select>
<label class="fl-check">From <input class="form-inp" type="date" value="${esc(f.from||'')}" data-change="flLpFilter" data-a="from"></label><label class="fl-check">to <input class="form-inp" type="date" value="${esc(f.to||'')}" data-change="flLpFilter" data-a="to"></label>
<label class="fl-check"><input type="checkbox" data-change="flLpTier"${ws.lp.showTier?' checked':''}> Show the priority tier</label></div>
<p class="fl-small fl-muted">Code prefixes: ${secIds.map(s=>`<label class="fl-check">${esc((WS_SECTORS.find(x=>x.id===s)||{}).n||s)} <input class="form-inp fl-w" maxlength="6" value="${esc((ws.lp.prefixes||{})[s]||WS_LP_PREFIX[s]||'GEN')}" data-change="flLpPrefix" data-a="${esc(s)}"></label>`).join(' ')}</p>
<label class="acct-field">Reviewer name (to accept a flag) <input class="form-inp" id="fl-lp-rev" maxlength="80" value="${esc(FS.lpRev||flWho())}" data-change="flLpRev"></label>
<p class="${nOpen?'fl-warn':'fl-good'}"><b>${ents.length}</b> compan${ents.length===1?'y':'ies'} · ${nOpen?`${nOpen} open flag${nOpen===1?'':'s'}: export blocked until each is fixed or accepted by a named reviewer.`:'Anonymization check passed.'}</p>
<div class="tbl-wrap"><table class="fl-tbl"><thead><tr><th scope="col">In</th><th scope="col">Code</th><th scope="col">Sector</th><th scope="col">Stage</th><th scope="col">Round</th><th scope="col">Valuation</th><th scope="col">Region</th><th scope="col">Description and fit</th><th scope="col">Pipeline</th>${ws.lp.showTier?'<th scope="col">Tier</th>':''}</tr></thead><tbody>
${open.map(({e,fl})=>`<tr class="${fl.length?'fl-flagged':''}"><td><input type="checkbox" aria-label="Include ${esc(e.code)}" checked data-change="flLpInclude" data-a="${esc(e.id)}"></td><th scope="row">${esc(e.code)}</th><td>${esc(e.sector)}${e.subsector?`<div class="fl-muted fl-small">${esc(e.subsector)}</div>`:''}</td><td>${esc(e.stage)}</td><td>${esc(e.round)}</td><td>${esc(e.valuation)}</td><td>${esc(e.region)}</td>
<td>${FS.lpEdit===e.id?`<textarea class="form-inp" rows="2" id="fl-lp-d" aria-label="Description">${esc(e.description)}</textarea><textarea class="form-inp" rows="2" id="fl-lp-f" aria-label="Why it fits">${esc(e.fit)}</textarea><button class="btn btn-primary btn-sm" data-click="flLpSave" data-a="${esc(e.id)}">Check and keep</button>`:`${esc(e.description)}<div class="fl-muted fl-small">${esc(e.fit)}</div><button class="btn btn-ghost btn-sm" data-click="flLpEditGo" data-a="${esc(e.id)}">Edit</button>`}
${fl.map(x=>`<div class="fl-lpflag"><span class="fl-flag">${esc(x.kind)}</span> “${esc(x.match)}” in ${esc(x.field)}. ${esc(x.why)} <button class="btn btn-ghost btn-sm" data-click="flLpFixGo" data-a="${esc(e.id)}" data-b="${esc(x.key)}">${x.suggest?`Replace with “${esc(x.suggest)}”`:'Remove it'}</button> <button class="btn btn-ghost btn-sm" data-click="flLpAcceptGo" data-a="${esc(e.id)}" data-b="${esc(x.key)}">Accept as is</button></div>`).join('')}</td>
<td>${esc(e.pipelineStage)}</td>${ws.lp.showTier?`<td>${esc(e.tier)}</td>`:''}</tr>`).join('')}</tbody></table></div>
<p>${on?`<button class="btn btn-primary btn-sm" data-click="flLpDrive"${nOpen?' disabled':''}>${ex.lpDoc?'Refresh in Google Drive':'Create in Google Drive (Doc, Sheet and PDF)'}</button>`:''}
<button class="btn btn-ghost btn-sm" data-click="flLpView"${nOpen?' disabled':''}>Preview and print (PDF)</button> <button class="btn btn-ghost btn-sm" data-click="flLpDownload" data-a="html"${nOpen?' disabled':''}>Download (HTML)</button> <button class="btn btn-ghost btn-sm" data-click="flLpDownload" data-a="csv"${nOpen?' disabled':''}>Download (CSV)</button></p>
<p class="fl-small">${['lpDoc','lpSheet','lpPdf'].filter(k=>ex[k]).map(k=>({lpDoc:'Google Doc',lpSheet:'Google Sheet',lpPdf:'PDF'})[k]+':'+link(k)).join(' · ')} ${ex.lpDoc?'· Data as of the last refresh; refresh in one click when the pipeline changes.':''}</p>
${(ws.lp.log||[]).length?`<details class="fl-small"><summary>Accepted flags log (${ws.lp.log.length})</summary><ul>${ws.lp.log.slice(-40).reverse().map(l=>`<li>${esc(String(l.at).slice(0,16).replace('T',' '))} ${esc(l.by)}: ${esc(l.code)} ${esc(l.text)}</li>`).join('')}</ul></details>`:''}
</div>`}
const flLpEnts=()=>{const f=Object.assign({},FS.lpf);return wsLpEntries(flWs(),FS.deals,f)};function flLpFilter(k,v){FS.lpf[k]=v;flRender()}
function flLpRev(v){FS.lpRev=String(v).slice(0,80)}
async function flWsSaveDirect(mut){const w=JSON.parse(JSON.stringify(flWs()));mut(w);const d=wsNormalize(w);try{FS.cur.version=await FS.store.saveWorkspace(FS.cur.id,d,FS.cur.version);FS.cur.settings=d;_flDraft=null}catch(e){toast(e.code==='version_conflict'?'Settings changed elsewhere: reload the page.':'Not saved: '+(e.message||e.code),'err',7000)}flRender()}
function flLpTier(on){flWsSaveDirect(w=>{w.lp.showTier=!!on})}
function flLpPrefix(s,v){if(!/^[A-Za-z0-9]{1,6}$/.test(v)){toast('A prefix is 1 to 6 letters or digits.','err');return}flWsSaveDirect(w=>{w.lp.prefixes=Object.assign({},w.lp.prefixes,{[s]:v})})}
function flLpInclude(id,on){const d=FS.deals.find(x=>x.id===id);if(!d)return;d.lp=Object.assign({},d.lp,{exclude:!on});flSave(d).then(flRender)}
function flLpEditGo(id){FS.lpEdit=id;flRender()}
function flLpSave(id){const d=FS.deals.find(x=>x.id===id);if(!d)return;d.lp=Object.assign({},d.lp,{description:wsClip(($id('fl-lp-d')||{}).value,600),fit:wsClip(($id('fl-lp-f')||{}).value,400)});FS.lpEdit=null;flSave(d).then(flRender)}
function flLpFlag(id,key){const d=FS.deals.find(x=>x.id===id),e=flLpEnts().find(x=>x.id===id);return d&&e?{d,e,f:wsLpOpenFlags(e,d,FS.deals.filter(x=>!x.mergedInto)).find(x=>x.key===key)}:{}}
function flLpFixGo(id,key){const{d,e,f}=flLpFlag(id,key);if(!f)return;if(f.field==='subsector'){d.facts=Object.assign({},d.facts,{src:Object.assign({},(d.facts||{}).src,{sector:Object.assign({},((d.facts||{}).src||{}).sector,{word:''})})})}
else d.lp=Object.assign({},d.lp,{[f.field]:wsLpFix(e[f.field],f)});flSave(d).then(flRender)}
function flLpAcceptGo(id,key){const{d,f}=flLpFlag(id,key),who=(FS.lpRev||($id('fl-lp-rev')||{}).value||'').trim();if(!f)return;if(!who){toast('Type the reviewer name first.','err');return}
const r=wsLpAccept(flWs(),d,Object.assign({},f),who),code=flLpEnts().find(x=>x.id===id).code;r.log[r.log.length-1].code=code;Object.assign(d,{lp:r.deal.lp});flSave(d).then(()=>flWsSaveDirect(w=>{w.lp.log=r.log}))}
function flLpOut(kind){const ws=flWs(),ents=flLpEnts(),asOf=wsIso(Date.now()),byId=Object.fromEntries(FS.deals.map(d=>[d.id,d]));if(ents.some(e=>wsLpOpenFlags(e,byId[e.id],FS.deals.filter(d=>!d.mergedInto)).length))throw new Error('Some entries still have open flags.');const out=kind==='csv'?wsLpCSV(ws,ents,asOf):wsLpHTML(ws,ents,asOf);const leaks=wsLpLeaks(out,FS.deals);if(leaks.length)throw new Error(`Blocked: internal information found in the export (${leaks.length}). Check the descriptions.`);return out}
function flDdpOut(){const out=wsDdpHTML(flWs(),wsIso(Date.now()));if(wsLpLeaks(out,FS.deals).length)throw new Error('Blocked: the process text names a company or a person from your pipeline.');return out}
function flPrintHTML(html){const u=URL.createObjectURL(new Blob([html.replace('</body>','<p style="font:12px sans-serif;color:#777">To save it as PDF: Print, then “Save as PDF”.</p></body>')],{type:'text/html'}));const w=window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000);if(!w)toast('Allow pop-ups for this site to open the preview.','err');else try{w.opener=null}catch(e){}}
function flDdpView(){flPrintHTML(flDdpOut())}
function flDdpDownload(){downloadFile(`${wsSlug(flWs().name)}-due-diligence-process-LP.html`,flDdpOut(),'text/html')}
function flLpView(){flPrintHTML(flLpOut('html'))}
function flLpDownload(k){const ws=flWs();downloadFile(`${wsSlug(ws.name)}-pipeline-LP-${wsIso(Date.now())}.${k==='csv'?'csv':'html'}`,flLpOut(k),k==='csv'?'text/csv':'text/html')}
async function flDriveDoc(key,name,html,kind){const con=WSG,ex=flWs().lp.exports||{},parent=(flWs().storage.folders.root||{}).id,bytes=new TextEncoder().encode(html);if(ex[key]){try{const r=await con.update(ex[key].id,bytes,kind==='sheet'?'text/csv':'text/html');return{id:r.id,url:ex[key].url||r.url,at:new Date().toISOString()}}catch(e){}}
const r=await con.upload(name,bytes,kind==='sheet'?'text/csv':'text/html',parent,kind==='sheet'?'sheet':true);return{id:r.id,url:r.url,at:new Date().toISOString()}}
async function flDrivePdf(key,name,docId){const ex=flWs().lp.exports||{},pdf=await WSG.exportPdf(docId),parent=(flWs().storage.folders.root||{}).id;if(ex[key]){try{const r=await WSG.update(ex[key].id,pdf,'application/pdf');return{id:r.id,url:ex[key].url||r.url,at:new Date().toISOString()}}catch(e){}}
const r=await WSG.upload(name,pdf,'application/pdf',parent,false);return{id:r.id,url:r.url,at:new Date().toISOString()}}
async function flDdpDrive(){try{toast('Writing the process document…');const html=flDdpOut(),nm=`${flWs().name}: due diligence process (LP-facing)`;const doc=await flDriveDoc('ddpDoc',nm,html),pdf=await flDrivePdf('ddpPdf',nm+'.pdf',doc.id);await flWsSaveDirect(w=>{w.lp.exports=Object.assign({},w.lp.exports,{ddpDoc:doc,ddpPdf:pdf})});toast('Process document ready in your Drive.')}
catch(e){toast(String(e.message||e).slice(0,200),'err',8000)}}
async function flLpDrive(){try{toast('Writing the pipeline overview…');const html=flLpOut('html'),csv=flLpOut('csv'),nm=`${flWs().name}: pipeline overview (LP-facing)`;const doc=await flDriveDoc('lpDoc',nm,html),sheet=await flDriveDoc('lpSheet',nm,csv,'sheet'),pdf=await flDrivePdf('lpPdf',nm+'.pdf',doc.id);await flWsSaveDirect(w=>{w.lp.exports=Object.assign({},w.lp.exports,{lpDoc:doc,lpSheet:sheet,lpPdf:pdf})});toast('Pipeline overview ready in your Drive (Doc, Sheet, PDF).')}
catch(e){toast(String(e.message||e).slice(0,200),'err',8000)}}
Object.assign(FLOW_CALLS,{flStage,flStageEv,flImportProc,flImportApply,flImportDrop,flIcMem,flIcAdd,flIcDel,flTickItem,flIcVote,flIcSave,flLpFilter,flLpRev,flLpTier,flLpPrefix,flLpInclude,flLpEditGo,flLpSave,flLpFixGo,flLpAcceptGo,flDdpView,flDdpDownload,flLpView,flLpDownload,flDdpDrive,flLpDrive});
</script>
